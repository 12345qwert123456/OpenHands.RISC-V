name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity, which silently stops the daily build. If the last commit is
# older than 40 days, push an empty one. Commits made with GITHUB_TOKEN do not
# trigger other workflows.

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push an empty commit when the repository is idle
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit is ${age} days old"
          if (( age >= 40 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: keep scheduled workflows enabled"
            git push
          fi
